set_ems_mode:
  fields:
    entry_id:
      required: false
      example: "01J8ZK..."
      selector:
        text:
    mode:
      required: true
      selector:
        select:
          options:
            - auto
            - charge_pv
            - discharge_pv
            - import_ac
            - export_ac
            - battery_standby
            - charge_bat
            - discharge_bat
            - stopped
    power:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 10000
          step: 100
          unit_of_measurement: W

set_export_limit:
  fields:
    entry_id:
      required: false
      selector:
        text:
    enabled:
      required: true
      selector:
        boolean:
    power:
      required: false
      selector:
        number:
          min: -30000
          max: 30000
          step: 100
          unit_of_measurement: W

force_charge:
  fields:
    entry_id:
      required: false
      selector:
        text:
    power:
      required: true
      selector:
        number:
          min: 0
          max: 10000
          step: 100
          unit_of_measurement: W

force_discharge:
  fields:
    entry_id:
      required: false
      selector:
        text:
    power:
      required: true
      selector:
        number:
          min: 0
          max: 10000
          step: 100
          unit_of_measurement: W

stop_forcing:
  fields:
    entry_id:
      required: false
      selector:
        text:

clear_economic_schedule:
  fields:
    entry_id:
      required: false
      selector:
        text:
